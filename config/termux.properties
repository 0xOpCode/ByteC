# ==============================================================================
# ByteC: Termux Touch Navigation and Extra Keys Bar
# 2-Row Ergonomic Layout for Mobile C/C++ Coding without External Keyboard
# ==============================================================================

# 2-Row touch keys bar: navigation arrows, C/C++ tokens, and long-press popups
extra-keys = [ \
  ['ESC', 'TAB', 'CTRL', 'ALT', {key: '#', popup: '/'}, {key: '<', popup: '-'}, {key: '>', popup: '+'}, {key: '&', popup: '|'}, {key: '*', popup: '\\'}, '='], \
  ['LEFT', 'DOWN', 'UP', 'RIGHT', {key: '{', popup: '['}, {key: '}', popup: ']'}, '(', ')', ';', {key: '"', popup: '\''}] \
]

# Style & Feedback
extra-keys-style = arrows-all
bell-character = ignore
fullscreen = false
use-black-ui = true
