# ==============================================================================
# ByteC: Termux Touch Navigation and Extra Keys Bar
# 2-Row Ergonomic Layout for Mobile C/C++ Coding without External Keyboard
# ==============================================================================

# 2-Row touch keys bar: navigation arrows + all C programming tokens
extra-keys = [ \
  ['ESC', 'TAB', 'CTRL', 'ALT', '{', '}', '(', ')'], \
  ['LEFT', 'DOWN', 'UP', 'RIGHT', '"', ';', '/', '-'] \
]

# Style & Feedback
extra-keys-style = arrows-all
bell-character = ignore
fullscreen = false
use-black-ui = true
