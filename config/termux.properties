# ==============================================================================
# 📱 ByteC — Termux Touch Navigation & Extra Keys Bar
# Optimized for mobile C coding without external keyboard
# ==============================================================================

# Enable full extra touch keys row
extra-keys = [ \
  ['ESC', 'TAB', 'CTRL', 'ALT', '{', '}', '(', ')', '"', ';', '/', '-'] \
]

# Style & Feedback
extra-keys-style = arrows-all
bell-character = ignore
fullscreen = false
use-black-ui = true
